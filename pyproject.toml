[project]
name = "hackernews-epub-digest"
version = "0.2.0"
description = "Build and email an EPUB digest of Hacker News with article summaries."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "ebooklib>=0.20",
    "langcodes[data]>=3.5.1,<4",
    "litellm>=1.106.4,<2",
    "markdown>=3.11.2,<4",
    "nh3>=0.3.7,<0.4",
    "pypdf>=6.21.2,<7",
    "requests>=2.34.2,<3",
    "structlog>=26.1.0,<27",
    "trafilatura>=2.3.1,<3",
    "urllib3>=2.8.0,<3",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.2,<0.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
