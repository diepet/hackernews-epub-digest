name: Daily HN Digest

on:
  schedule:
    # 04:17 CET / 05:17 CEST; avoid the busy start of the UTC hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-hn-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'Italian' }}
      STORY_LIMIT: ${{ vars.STORY_LIMIT || '30' }}
      LLM_RPM_LIMIT: ${{ vars.LLM_RPM_LIMIT || '15' }}
      LLM_TPM_LIMIT: ${{ vars.LLM_TPM_LIMIT || '250000' }}
      LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS || '10000' }}
      LLM_MAX_WAIT_SECONDS: ${{ vars.LLM_MAX_WAIT_SECONDS || '300' }}
      SCRAPE_CHAR_LIMIT: ${{ vars.SCRAPE_CHAR_LIMIT || '500000' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini/gemini-3.5-flash-lite' }}
      LLM_SYSTEM_PROMPT: ${{ vars.LLM_SYSTEM_PROMPT }}
      HTTP_TIMEOUT: ${{ vars.HTTP_TIMEOUT || '20' }}
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '90' }}
      SMTP_TIMEOUT: ${{ vars.SMTP_TIMEOUT || '30' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '2' }}
      LOG_FORMAT: ${{ vars.LOG_FORMAT || 'text' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      ROOT_LOG_LEVEL: ${{ vars.ROOT_LOG_LEVEL || 'WARNING' }}
      RUN_MODE: ${{ vars.RUN_MODE || 'deliver' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
          python-version: '3.12'

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Build digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ vars.AZURE_API_VERSION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          PUBLISH_EMAIL: ${{ secrets.PUBLISH_EMAIL }}
        run: |
          case "$RUN_MODE" in
            deliver) uv run --frozen --no-dev python main.py ;;
            dry-run) uv run --frozen --no-dev python main.py --dry-run ;;
            scrape-only) uv run --frozen --no-dev python main.py --no-llm ;;
            *) exit 1 ;;
          esac

      - name: Keep EPUB and run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hn-digest-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from html import escape
          from pathlib import Path

          path = Path('output/run-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not path.exists():
                  summary.write('No run report: check dependency installation and configuration logs.\n')
              else:
                  report = json.loads(path.read_text())
                  summary.write('## Digest result\n\n')
                  labels = {'mode': 'Mode', 'status': 'Result', 'requested': 'Requested stories',
                            'fetched': 'Fetched stories', 'extracted': 'Readable sources',
                            'summarized': 'Generated summaries', 'email_sent': 'SMTP accepted email',
                            'duration_seconds': 'Elapsed seconds'}
                  for key, label in labels.items():
                      summary.write(f'- **{label}**: {report.get(key, "not reported")}\n')
                  if report.get('failure_reason'):
                      summary.write(f'\n**Failure:** {escape(report["failure_reason"])}\n')
                  if report.get('llm'):
                      llm = report['llm']
                      summary.write(f'\nLLM attempts: {llm["requests_sent"]}; rate limits: {llm["rate_limits_seen"]}; '
                                    f'waiting: {llm["wait_seconds"]}s; reported tokens: {llm["reported_tokens"] if llm["reported_tokens"] is not None else "not reported"}.\n')
                  summary.write('\n| Story | Result | Source characters | Summary words |\n| --- | --- | ---: | ---: |\n')
                  for item in report.get('stories', []):
                      title = escape(item['title']).replace('|', '&#124;').replace('\n', ' ').replace('\r', ' ')
                      status = item['status'].replace('_', ' ')
                      summary.write(f'| {title} | {status} | {item.get("source_characters", "—")} | '
                                    f'{item.get("summary_words", "—")} |\n')
                  summary.write('\nDownload the artifact for the EPUB and detailed run report.\n')
          PY
