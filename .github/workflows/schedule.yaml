name: Daily HN Digest

on:
  schedule:
    # 03:00 UTC is usually 04:00 CET (Winter) / 05:00 CEST (Summer)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  run-digest:
    runs-on: ubuntu-latest
    
    # LOGIC: 
    # 1. Look for a GitHub Variable (vars.NAME)
    # 2. If not found, use the hardcoded default (|| 'value')
    env:
      TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'English' }}
      STORY_LIMIT: ${{ vars.STORY_LIMIT || '10' }}
      LLM_REQUEST_DELAY: ${{ vars.LLM_REQUEST_DELAY || '0' }}
      SCRAPE_CHAR_LIMIT: ${{ vars.SCRAPE_CHAR_LIMIT || '60000' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini/gemini-1.5-flash' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. Set up Python
      - name: Set up Python
        run: uv python install

      # 3. Install Dependencies
      - name: Install dependencies
        run: uv sync

      # 4. Run the Script
      - name: Run Digest Script
        env:
          # AI Keys (Map the one you are using)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          
          # Azure Keys (If using Azure)
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}

          # Email Config
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          PUBLISH_EMAIL: ${{ secrets.PUBLISH_EMAIL }}
          
        run: uv run python main.py